[package]
name = "lumen"
version = "1.0.0"
description = "Lumen — local-first live-production station"
edition = "2021"

# SCAFFOLD: this Tauri shell is written and reviewable but NOT compiled in the
# sandbox (no Rust/Tauri toolchain). It wraps the existing Vue frontend as the
# webview and supervises two managed sidecars: the Express backend (lumen-server)
# and the media engine (lumen-media). The browser dev flow is unchanged —
# `beforeDevCommand` reuses the existing `npm run dev` and Tauri just opens a
# native window onto the same Vite server.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
